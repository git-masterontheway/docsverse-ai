services:
  - type: web
    name: docverse-ai
    env: node
    plan: free
    buildCommand: npm install && node scripts/setup.js
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemini-2.0-flash-001
      - key: REPORTLAB_PDF_ENGINE
        value: "true"
